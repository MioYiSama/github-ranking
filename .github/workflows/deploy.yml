name: Deploy GitHub Ranking

on:
  push:
    branches: ["main", "001-github-star-ranking"]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  GITHUB_RANKING_LANGUAGE_PAGES: "1"
  GITHUB_SEARCH_INTERVAL_MS: "8000"
  GITHUB_SEARCH_MAX_RETRIES: "2"
  GITHUB_SEARCH_SECONDARY_RETRY_MS: "180000"

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch live ranking data
        run: pnpm data:fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build static site for deployment
        run: pnpm build:static
        env:
          PUBLIC_SITE: ${{ steps.pages.outputs.origin }}
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
